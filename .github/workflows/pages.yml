# Publishes the landing page in site/ to GitHub Pages. The page holds no downloads; it links to the releases.
# Pages on a private repository needs a paid GitHub plan (docs/release.md).
name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Skipped while the repository is private, so nothing is published before it goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Fill in the repository
        run: sed -i "s#@REPO@#${GITHUB_REPOSITORY}#g" site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
