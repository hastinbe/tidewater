[package]
name = "tidewater-shell-sdl3"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tidewater-sdl3"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tidewater-client = { path = "../client", default-features = false }
# SDL 3 built from its source (CMake and a C compiler; no SDL install needed) and linked in, with only the audio,
# video and render subsystems.
sdl3-sys = { version = "0.7", features = ["build-from-source", "link-static", "no-default-subsystems", "sdl-audio", "sdl-render"] }

# The workspace's lints, but `unsafe_code` is denied rather than forbidden: the SDL wrapper (`sdl.rs`) allows it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
