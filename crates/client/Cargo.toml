[package]
name = "tidewater-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tidewater_client"
path = "src/lib.rs"

# The player's program: the core in the SDL 3 shell (`src/shell/`).
[[bin]]
name = "tidewater"
path = "src/shell/main.rs"

[dependencies]
serde.workspace = true
postcard.workspace = true
directories.workspace = true
anyhow.workspace = true
clap.workspace = true
glam.workspace = true
png.workspace = true
tidewater-formats.workspace = true
tidewater-import.workspace = true
tidewater-sim.workspace = true
tidewater-replay.workspace = true
# SDL 3 built from its source (CMake and a C compiler; no SDL install needed) and linked in, with only the audio,
# video, render and dialog subsystems (the first-run screen's file pickers). Only the shell (`src/shell/`) uses it.
sdl3-sys = { version = "0.7", features = ["build-from-source", "link-static", "no-default-subsystems", "sdl-audio", "sdl-render", "sdl-dialog"] }

[dev-dependencies]
tempfile.workspace = true

# The workspace's lints, but `unsafe_code` is denied rather than forbidden: the shell's SDL wrapper
# (`src/shell/sdl.rs`) allows it. The library forbids it itself (`lib.rs`).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
